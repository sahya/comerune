# ghalint configuration
#
# ここで除外する policy / step はすべて「ローカルで lint を緑にするためだけ」の
# 静的な抜け穴ではなく、設計上避けられない例外を明示するものとして書く。
# 新規追加時は同じ階層のコメントで根拠を書くこと。

excludes:
  # release.yml の release job は、checkout 直後に "Create and push annotated tag"
  # step で `git tag -a` / `git push origin "$VERSION"` を実行する。tag push は
  # checkout の persist-credentials で残した token を再利用するため、本 step
  # では persist-credentials: false を設定できない。
  #
  # この例外は release job 固有 (validate / ci job は別途 persist-credentials: false
  # を入れている)。同 workflow の他 job が増えても本 exclude は流用しないこと。
  - policy_name: checkout_persist_credentials_should_be_false
    workflow_file_path: .github/workflows/release.yml
    job_name: release
