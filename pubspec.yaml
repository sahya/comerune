name: comerune
description: ニコ生コメント取得・表示・読み上げアプリ
publish_to: "none"

version: 1.2.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # WebSocket（入口WS: wss://a.live2.nicovideo.jp/wsapi/v2/watch/{lv}）
  web_socket_channel: ^3.0.1

  # HTTP streaming（NDGR: /api/view/v4/, /data/segment/v4/, /data/backward/v4/）
  # および VOICEVOX HTTP API（/audio_query, /synthesis）
  # StreamedResponse でチャンク単位の読み取りが必要
  http: ^1.2.2

  # 音声再生（VOICEVOX合成音声の再生）
  audioplayers: ^6.1.0

  # Protobufデコード（NDGRのlength-delimited stream）
  # ChunkedEntry / ChunkedMessage / PackedSegment のデコードに使用
  # .protoファイルからのコード生成は dev の protoc_plugin で行う
  protobuf: ^3.1.0

  # リアクティブストリーム（複数 segment 接続の合成・イベント配信）
  # N Air実装(NdgrCommentReceiver)がRxJS Subject/Observable相当を多用するため必要
  # dart:async の StreamController だけでは switchMap/mergeAll 等の演算子が得られない
  rxdart: ^0.28.0

  # 設定永続化（読み上げエンジン選択・接続設定）
  shared_preferences: ^2.3.3

  # WebView（ニコニコログイン画面でuser_sessionクッキー取得）
  webview_flutter: ^4.10.0

  # 認証情報の暗号化保存（Android Keystore / iOS Keychain）
  flutter_secure_storage: ^10.0.0

  # コメントログのファイル保存先ディレクトリ取得
  path_provider: ^2.1.0

  # コメントログの共有（Google Drive等の外部ストレージへの保存）
  share_plus: ^10.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Protobuf コード生成（.proto → Dart クラス）
  # protoc --dart_out で使用。実行時には不要
  protoc_plugin: ^21.1.2

flutter:
  uses-material-design: true
