name: comerune
description: ニコ生コメント取得・表示・読み上げアプリ
publish_to: "none"

version: 1.0.0+2

environment:
  sdk: ">=3.11.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Dartアノテーション（@visibleForTesting等）
  meta: 1.17.0

  # WebSocket（入口WS: wss://a.live2.nicovideo.jp/wsapi/v2/watch/{lv}）
  web_socket_channel: 3.0.3

  # HTTP streaming（NDGR: /api/view/v4/, /data/segment/v4/, /data/backward/v4/）
  # および VOICEVOX HTTP API（/audio_query, /synthesis）
  # StreamedResponse でチャンク単位の読み取りが必要
  http: 1.6.0

  # 音声再生（VOICEVOX合成音声の再生）
  audioplayers: 6.6.0

  # リアクティブストリーム（複数 segment 接続の合成・イベント配信）
  # N Air実装(NdgrCommentReceiver)がRxJS Subject/Observable相当を多用するため必要
  # dart:async の StreamController だけでは switchMap/mergeAll 等の演算子が得られない
  rxdart: 0.28.0

  # 設定永続化（読み上げエンジン選択・接続設定）
  shared_preferences: 2.5.5

  # WebView（ニコニコログイン画面でuser_sessionクッキー取得）
  webview_flutter: 4.13.1

  # 認証情報の暗号化保存（Android Keystore / iOS Keychain）
  flutter_secure_storage: 10.0.0

  # コメントログのファイル保存先ディレクトリ取得
  path_provider: 2.1.5

  # コメントログの共有（Google Drive等の外部ストレージへの保存）
  share_plus: 13.1.0

  # コメントログ自動保存先のディレクトリ選択 / 設定 Import 時のファイル選択
  # file_picker (monolithic, win32 5.x bundled) からの乗り換え。
  # file_selector は flutter.dev publisher の federated 構造で、
  # Windows 実装は別パッケージのため Android/iOS ビルドには混入しない。
  file_selector: 1.1.0

  # Android Foreground Service（バックグラウンド接続維持・通知バー常駐表示）
  flutter_foreground_task: 9.2.2
  wakelock_plus: 1.6.0

  # コメント内URLを既定ブラウザで開く（WebView 経由ではなく OS ハンドラに委ねる）
  url_launcher: 6.3.2

  # アプリバージョン取得（ライセンスページの applicationVersion を pubspec.yaml と自動同期）
  package_info_plus: 10.1.0

  # 時計抽象化（テストで `withClock` により NG 保護通知の throttle を制御する）
  # Dart エコシステム標準・小規模・安定版 API のみ使用。
  clock: 1.1.2

  # ユーザーコメント色のカスタムカラー選択（プリセット 12 色に加えて任意色を選択可能にする）
  flutter_colorpicker: 1.1.0

  # OIDC 認可フローの App Links コールバック受信
  # （ビルド時注入された BFF host 上のコールバック URL への復帰を intent としてアプリで受ける）
  app_links: 7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
  fake_async: 1.3.3

# flutter_secure_storage_windows 4.1.0 still constrains win32 to ^5.5.4 even
# though the rest of the ecosystem (package_info_plus, share_plus, wakelock_plus)
# has migrated to win32 6.x. The Windows implementation package is federated
# and is never compiled into Android/iOS builds (no windows/ directory in this
# repo). Remove this override once flutter_secure_storage_windows publishes a
# release that accepts win32 ^6.0.0.
dependency_overrides:
  win32: 6.1.0

flutter:
  uses-material-design: true
  assets:
    - android/app/src/main/assets/preset_ng_words.json
    - android/app/src/main/assets/voicevox_models/TERMS.txt
