name: comerune
description: ニコ生コメント取得・表示・読み上げアプリ
publish_to: "none"

version: 1.2.0+9

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Dartアノテーション（@visibleForTesting等）
  meta: 1.18.0

  # WebSocket（入口WS: wss://a.live2.nicovideo.jp/wsapi/v2/watch/{lv}）
  web_socket_channel: 3.0.3

  # HTTP streaming（NDGR: /api/view/v4/, /data/segment/v4/, /data/backward/v4/）
  # および VOICEVOX HTTP API（/audio_query, /synthesis）
  # StreamedResponse でチャンク単位の読み取りが必要
  http: 1.6.0

  # 音声再生（VOICEVOX合成音声の再生）
  audioplayers: 6.8.1

  # リアクティブストリーム（複数 segment 接続の合成・イベント配信）
  # N Air実装(NdgrCommentReceiver)がRxJS Subject/Observable相当を多用するため必要
  # dart:async の StreamController だけでは switchMap/mergeAll 等の演算子が得られない
  rxdart: 0.28.0

  # 設定永続化（読み上げエンジン選択・接続設定）
  shared_preferences: 2.5.5

  # WebView（ニコニコログイン画面でuser_sessionクッキー取得）
  webview_flutter: 4.14.1

  # 認証情報の暗号化保存（Android Keystore / iOS Keychain）
  flutter_secure_storage: 10.3.1

  # コメントログのファイル保存先ディレクトリ取得
  path_provider: 2.1.6

  # コメントログの共有（Google Drive等の外部ストレージへの保存）
  share_plus: 13.3.0

  # コメントログ自動保存先のディレクトリ選択
  file_picker: 12.2.0

  # Android Foreground Service（バックグラウンド接続維持・通知バー常駐表示）
  flutter_foreground_task: 9.2.2
  wakelock_plus: 1.7.0

  # コメント内URLを既定ブラウザで開く（WebView 経由ではなく OS ハンドラに委ねる）
  url_launcher: 6.3.2

  # アプリバージョン取得（ライセンスページの applicationVersion を pubspec.yaml と自動同期）
  # wakelock_plus 1.7.0 が package_info_plus ^10.1.0 を要求するため 10.x 系の最新版にピン留め
  package_info_plus: 10.2.1

  # 時計抽象化（テストで `withClock` により NG 保護通知の throttle を制御する）
  # Dart エコシステム標準・小規模・安定版 API のみ使用。
  clock: 1.1.2

  # ユーザーコメント色のカスタムカラー選択（プリセット 12 色に加えて任意色を選択可能にする）
  flutter_colorpicker: 1.1.0

  # OIDC 認可フローの App Links コールバック受信
  # （ビルド時注入された BFF host 上のコールバック URL への復帰を intent としてアプリで受ける）
  app_links: 7.2.1

  # SHA-256 / HMAC-SHA256（同梱プリセットフィルタの軽量難読化アセットの復号に使用）。
  # 発行元 dart.dev（検証済みパブリッシャ）。既に依存解決ツリーに 3.0.7 が存在するため
  # exact pin で直接依存へ昇格するだけで sha256 ハッシュは変わらない。
  crypto: 3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
  fake_async: 1.3.3

flutter:
  uses-material-design: true
  assets:
    - android/app/src/main/assets/preset_ng_words.enc
    - android/app/src/main/assets/voicevox_models/TERMS.txt
